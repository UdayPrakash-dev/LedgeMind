# LedgeMind — local stack
# Start everything:   docker compose up --build
# Stop everything:    docker compose down
# Wipe the database:  docker compose down -v

services:
  # ---------------------------------------------------------------
  # Postgres: the event store (permanent history of every change)
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ledgemind-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledgemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgemind}
      POSTGRES_DB: ${POSTGRES_DB:-ledgemind}
    ports:
      - "5432:5432"            # exposed so `go test` on your machine can reach it
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Tables are created by wallet-service on startup (wallet-service/migrations)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledgemind} -d ${POSTGRES_DB:-ledgemind}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Redis: snapshot cache + stuck-saga queue (Redis Streams)
  # ---------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ledgemind-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Wallet service (Go): the bank — wallets, transfers, sagas
  # ---------------------------------------------------------------
  wallet-service:
    build: ./wallet-service
    container_name: ledgemind-wallet
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ledgemind}:${POSTGRES_PASSWORD:-ledgemind}@postgres:5432/${POSTGRES_DB:-ledgemind}?sslmode=disable
      REDIS_ADDR: redis:6379
      SNAPSHOT_EVERY: "50"
      RAIL_URL: "${RAIL_URL:-http://fake-rail:9000}"   # the fake payment rail below
      RECOVERY_POLICY: "${RECOVERY_POLICY:-refund}"     # refund | retry | escalate (changeable at runtime)
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fake-rail:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Fake payment rail (Go): fails on purpose, in 5 repeatable ways
  # ---------------------------------------------------------------
  fake-rail:
    build: ./fake-rail
    container_name: ledgemind-rail
    environment:
      SEED: "${RAIL_SEED:-42}"              # same seed + same call order = same faults
      FAULT_RATE: "${RAIL_FAULT_RATE:-0}"   # 0 = no random faults (use the admin API instead)
      TIMEOUT_DELAY_MS: "5000"              # longer than the wallet's 2s rail timeout
      REVERSAL_DELAY_MS: "3000"             # "partial" payments get reversed after this
      PORT: "9000"
    ports:
      - "9000:9000"
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Recovery service (Python): AI planner + safety checker + memory
  # ---------------------------------------------------------------
  recovery-service:
    build: ./recovery-service
    container_name: ledgemind-recovery
    environment:
      REDIS_ADDR: redis:6379
      WALLET_URL: http://wallet-service:8080
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-20b}
      LLM_API_KEY: ${LLM_API_KEY:-}                 # from .env only; never commit it
      LLM_MIN_INTERVAL_S: "${LLM_MIN_INTERVAL_S:-2.0}"  # rate limit: seconds between AI calls
      LLM_MAX_TOKENS: "${LLM_MAX_TOKENS:-1024}"        # reasoning models think before answering
      LLM_REASONING_EFFORT: "${LLM_REASONING_EFFORT:-low}"  # low | medium | high (gpt-oss); ignored if unsupported
      STRATEGY: "${STRATEGY:-llm_no_verifier}"         # off | llm_no_verifier | llm_verified_memory
      CONSUMER_NAME: recovery-1                        # fixed name: after a restart it resumes its own pending messages
      DECISIONS_PATH: /data/decisions.jsonl
    volumes:
      - ./bench/results:/data                          # decisions.jsonl appears in bench/results on your machine
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      wallet-service:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Benchmark (only runs on demand: bench.bat / make bench)
  # ---------------------------------------------------------------
  bench:
    image: python:3.12-slim
    profiles: ["bench"]
    working_dir: /bench
    entrypoint: ["python", "-u", "run.py"]
    environment:
      WALLET_URL: http://wallet-service:8080
      RAIL_URL: http://fake-rail:9000
      RECOVERY_URL: http://recovery-service:8000
      DECISIONS_PATH: /bench/results/decisions.jsonl   # written by recovery-service (same folder)
    volumes:
      - ./bench:/bench
    depends_on:
      wallet-service:
        condition: service_started
      recovery-service:
        condition: service_started
      fake-rail:
        condition: service_started

volumes:
  pgdata:
  redisdata:
